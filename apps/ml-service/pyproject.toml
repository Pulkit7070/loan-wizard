[project]
name = "ml-service"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "scikit-learn==1.4.2",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.0",
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
